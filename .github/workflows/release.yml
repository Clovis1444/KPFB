name: Release(linux, windows)
on:
    workflow_call:
        inputs:
            release_tag:
                type: string
                description: "Tag to associate release with"
                required: true

env:
    SOURCE_DIR: ${{ github.workspace }}
    PROJECT_NAME: KPFB
    ARTIFACT_NAME: kpfb-${{inputs.release_tag}}

jobs:
    build:
        permissions:
            contents: write
        environment: CI
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repo
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Build
              run: npx --yes web-ext build

            - name: Sign firefox addon
              run: npx --yes web-ext sign --api-key ${{ secrets.JWT_ISSUER }} --api-secret ${{ secrets.JWT_SECRET }} --channel unlisted

            - name: Upload zip
              uses: actions/upload-artifact@v4
              with:
                  name: ${{env.ARTIFACT_NAME}}.zip
                  path: web-ext-artifacts/${{env.ARTIFACT_NAME}}.zip

            - name: Upload xpi
              uses: actions/upload-artifact@v4
              with:
                  name: ${{env.ARTIFACT_NAME}}.xpi
                  path: web-ext-artifacts/${{env.ARTIFACT_NAME}}.xpi

    upload_release:
        environment: CI
        needs: [build]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v4
              id: artifacts
              with:
                  merge-multiple: true
                  path: ${{env.SOURCE_DIR}}/artifacts

            - name: Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{inputs.release_tag}}
                  target_commitish: ${{github.sha}}
                  draft: true
                  files: ${{steps.artifacts.outputs.download-path}}/*
                  fail_on_unmatched_files: true
